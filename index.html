<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Learning Club">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f8f9fa">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23ffffff'/><text y='68' x='50' text-anchor='middle' font-size='50'>🎓</text></svg>">
<title>Learning Club</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg:#f8f9fa; --surface:#ffffff; --surface-2:#f8f9fa; --ink:#202124; --muted:#5f6368;
    --line:#dadce0; --accent:#1a73e8; --accent-ink:#1967d2; --ring:#1a73e8;
    --chip-bg:#e8f0fe; --chip-ink:#1967d2;
    --ok:#188038; --ok-bg:#e6f4ea; --warn:#b06000; --warn-bg:#fef7e0; --crit:#c5221f; --crit-bg:#fce8e6;
    --g-blue:#4285f4; --g-green:#34a853; --g-yellow:#f9ab00; --g-red:#ea4335; --g-purple:#9334e6;
    --shadow:0 1px 2px rgba(60,64,67,.14),0 1px 3px 1px rgba(60,64,67,.08);
    --shadow-hover:0 1px 2px rgba(60,64,67,.16),0 2px 8px 1px rgba(60,64,67,.12);
  }

  body {
    font-family:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    padding: env(safe-area-inset-top, 20px) env(safe-area-inset-right, 20px) env(safe-area-inset-bottom, 20px) env(safe-area-inset-left, 20px);
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }

  .screen { display: none; width: 100%; max-width: 640px; text-align: center; margin-top: 12px; }
  .screen.active { display: block; }

  h1.brand { font-size: 1.9rem; font-weight: 700; letter-spacing: -0.2px; margin-bottom: 4px; }
  h1.brand .cap { color: var(--g-blue); }
  h1.brand .l1 { color: var(--g-red); }
  h1.brand .l2 { color: var(--g-yellow); }
  h1.brand .l3 { color: var(--g-green); }
  .tagline { color: var(--muted); font-size: 14.5px; margin-bottom: 28px; }

  .profiles, .modes { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

  .profile-btn, .mode-btn {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 22px 26px;
    cursor: pointer;
    transition: .12s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    min-width: 170px;
    color: var(--ink);
    box-shadow: var(--shadow);
    font-family: inherit;
  }
  .profile-btn:hover, .mode-btn:hover { border-color: var(--accent); box-shadow: var(--shadow-hover); transform: translateY(-2px); }

  .profile-avatar, .mode-icon {
    width: 72px; height: 72px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 2.2rem;
  }
  .av-elsie { background: var(--crit-bg); }
  .av-freya { background: var(--ok-bg); }
  .av-teddy { background: var(--warn-bg); }
  .av-spelling { background: var(--chip-bg); }
  .av-maths { background: var(--warn-bg); }

  .profile-name, .mode-name { font-size: 1.25rem; font-weight: 700; }
  .profile-info, .mode-info { font-size: 0.85rem; color: var(--muted); line-height: 1.5; }

  .homefoot { margin-top: 30px; }
  .linkbtn { background: none; border: 0; color: var(--accent); font-weight: 600; font-size: 14px; cursor: pointer; font-family: inherit; padding: 8px; }

  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .topbar .left, .topbar .right { display: flex; align-items: center; gap: 8px; }

  .nav-pill {
    background: var(--surface); border: 1px solid var(--line); color: var(--muted);
    font-size: 0.85rem; font-weight: 600; cursor: pointer; padding: 8px 14px;
    border-radius: 999px; transition: .12s; white-space: nowrap; font-family: inherit; box-shadow: var(--shadow);
  }
  .nav-pill:hover { border-color: var(--accent); color: var(--ink); }

  .who-chip {
    display: inline-flex; align-items: center; gap: 8px; background: var(--surface);
    border: 1px solid var(--line); padding: 6px 14px 6px 6px; border-radius: 999px;
    font-weight: 700; font-size: 0.95rem; box-shadow: var(--shadow);
  }
  .who-chip .avatar-sm { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; }

  .streak-chip {
    background: var(--warn-bg); color: var(--warn); border-radius: 999px; padding: 6px 12px;
    font-size: 0.85rem; font-weight: 700; white-space: nowrap;
  }

  .ringwrap { position: relative; width: 48px; height: 48px; }
  .ringwrap svg { transform: rotate(-90deg); }
  .ringwrap .ring-track { stroke: var(--line); }
  .ringwrap .ring-fill { stroke: var(--accent); transition: stroke-dashoffset .4s ease; }
  .ringwrap.done .ring-fill { stroke: var(--ok); }
  .ringwrap .ring-label {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 0.62rem; font-weight: 700; color: var(--ink);
  }

  .topic-chip {
    display: inline-flex; align-items: center; gap: 6px; background: var(--chip-bg); color: var(--chip-ink);
    border-radius: 999px; padding: 5px 14px; font-size: 0.85rem; font-weight: 600; margin-bottom: 14px;
  }
  .topic-chip .tc-note { font-weight: 700; }

  .game-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 32px 26px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  .hint-text { font-size: 1.05rem; color: var(--muted); line-height: 1.6; margin-bottom: 22px; min-height: 34px; }
  .hint-text em { color: var(--warn); font-style: normal; font-weight: 600; }

  .question-text { font-size: 2rem; font-weight: 700; color: var(--ink); margin-bottom: 8px; min-height: 44px; letter-spacing: 0.5px; }
  .question-visual { margin: 8px 0 14px; min-height: 0; display: flex; justify-content: center; align-items: flex-end; }

  .input-row { display: flex; gap: 10px; justify-content: center; align-items: center; }

  .game-input {
    font-size: 1.4rem; padding: 12px 18px; border-radius: 12px;
    border: 2px solid var(--line); background: var(--surface); color: var(--ink);
    text-align: center; width: 100%; max-width: 340px; outline: none;
    transition: border-color .2s; font-family: inherit;
    -webkit-user-select: text; user-select: text;
  }
  .game-input.spelling-input { letter-spacing: 2px; }
  .game-input:focus { border-color: var(--accent); }
  .game-input.correct { border-color: var(--g-green); background: var(--ok-bg); }
  .game-input.wrong { border-color: var(--g-red); background: var(--crit-bg); }

  .btn {
    padding: 12px 28px; border-radius: 999px; border: 1px solid var(--line);
    font-size: 1rem; font-weight: 700; cursor: pointer; transition: .12s;
    font-family: inherit; background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
  }
  .btn:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-ink); }

  .btn-hear {
    background: var(--surface); border: 1px solid var(--line); color: var(--ink);
    font-size: 1.2rem; border-radius: 50%; width: 52px; height: 52px;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .btn-hear:hover { border-color: var(--accent); }

  .action-row { display: flex; gap: 12px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }

  .feedback { margin-top: 18px; font-size: 1.2rem; font-weight: 700; min-height: 36px; }
  .feedback.correct-fb { color: var(--ok); }
  .feedback.wrong-fb { color: var(--crit); }
  .feedback .bonus { display: block; font-size: 0.9rem; color: var(--warn); }

  .correct-answer { margin-top: 8px; font-size: 1.4rem; font-weight: 700; letter-spacing: 2px; color: var(--warn); }

  .overlay {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px; background: rgba(248,249,250,.96); z-index: 100; text-align: center; padding: 24px;
  }
  .overlay.show { display: flex; }
  .overlay .big { font-size: 4rem; }
  .overlay .msg { font-size: 1.7rem; font-weight: 700; }
  .overlay .sub { font-size: 1.05rem; color: var(--muted); margin-bottom: 14px; }
  .overlay .action-row { margin-top: 4px; }

  .toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--ink); color: #fff; border-radius: 999px; padding: 12px 22px;
    font-size: 0.95rem; font-weight: 600; z-index: 120; opacity: 0; transition: .25s; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  .confetti-piece { position: fixed; width: 10px; height: 10px; border-radius: 2px; z-index: 90; animation: confettiFall 1.5s forwards; pointer-events: none; }
  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  /* ===== TEDDY ===== */
  .teddy-stars { margin-bottom: 14px; font-size: 1.4rem; letter-spacing: 4px; min-height: 30px; }
  .teddy-prompt { font-size: 1.5rem; font-weight: 700; color: var(--ink); margin-bottom: 18px; min-height: 44px; }
  .teddy-visual { font-size: 3.4rem; margin-bottom: 22px; min-height: 60px; letter-spacing: 8px; line-height: 1.4; }
  .teddy-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: 400px; margin: 0 auto; }
  .teddy-choice {
    background: var(--surface); border: 2px solid var(--line); border-radius: 16px;
    padding: 22px 14px; font-size: 2.1rem; cursor: pointer; transition: .12s; color: var(--ink);
    display: flex; align-items: center; justify-content: center; min-height: 88px; box-shadow: var(--shadow); font-family: inherit;
  }
  .teddy-choice:hover { border-color: var(--accent); transform: scale(1.03); }
  .teddy-choice.correct-choice { border-color: var(--g-green); background: var(--ok-bg); transform: scale(1.05); }
  .teddy-choice.wrong-choice { border-color: var(--g-red); background: var(--crit-bg); opacity: 0.6; }
  .teddy-choice.disabled { pointer-events: none; }
  .teddy-feedback { margin-top: 18px; font-size: 1.4rem; font-weight: 700; min-height: 38px; }
  .teddy-feedback.correct-fb { color: var(--ok); }
  .teddy-feedback.wrong-fb { color: var(--crit); }

  /* Numberblocks visuals */
  .nb-tower { display: inline-flex; flex-direction: column-reverse; align-items: center; margin: 0 6px; }
  .nb-block { width: 28px; height: 28px; border-radius: 4px; margin: 1px 0; border: 1px solid rgba(0,0,0,0.15); }
  .nb-label { font-size: 1rem; font-weight: 700; margin-top: 2px; color: var(--ink); }
  .nb-sum { display: flex; align-items: flex-end; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .nb-op { font-size: 1.5rem; font-weight: 700; align-self: center; color: var(--ink); }
  .nb-array { display: inline-grid; gap: 2px; }
  .nb-array .nb-block { width: 24px; height: 24px; }
  .nb-array-label { font-size: 0.9rem; font-weight: 600; margin-top: 4px; color: var(--ink); text-align: center; }
  .nb-sm .nb-block { width: 20px; height: 20px; }
  .nb-sm .nb-label { font-size: 0.85rem; }
  .nb-sm .nb-array .nb-block { width: 18px; height: 18px; }

  /* ===== PARENT VIEW ===== */
  #screen-parent { text-align: left; }
  .p-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .p-head h2 { font-size: 1.4rem; }
  .kid-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .kid-card h3 { font-size: 1.15rem; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 4px 12px; font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
  .dots { display: flex; gap: 4px; margin: 6px 0 12px; align-items: center; flex-wrap: wrap; }
  .dot { width: 12px; height: 12px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); }
  .dot.hit { background: var(--g-green); border-color: var(--g-green); }
  .dot.part { background: var(--warn-bg); border-color: var(--g-yellow); }
  .dots .lbl { font-size: 11px; color: var(--muted); font-weight: 700; margin-right: 4px; text-transform: uppercase; letter-spacing: .05em; }
  .bandhd { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 12px 0 4px; }
  .prow { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--surface-2); font-size: 13.5px; }
  .prow .pname { font-weight: 600; text-align: left; }
  .prow .ppct { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12.5px; min-width: 38px; text-align: right; }
  .pill { font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .pill.st-mastered { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
  .pill.st-solid { background: var(--chip-bg); color: var(--chip-ink); border-color: transparent; }
  .pill.st-learning { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
  .pill.st-shaky { background: var(--crit-bg); color: var(--crit); border-color: transparent; }
  .pill.st-new, .pill.st-locked { background: var(--surface-2); }
  .trouble { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .trouble b { color: var(--crit); }

  @media (max-width: 520px) {
    body { padding: 12px; padding-top: env(safe-area-inset-top, 12px); }
    h1.brand { font-size: 1.6rem; }
    .tagline { margin-bottom: 20px; }
    .profiles, .modes { flex-direction: column; align-items: stretch; gap: 10px; }
    .profile-btn, .mode-btn { flex-direction: row; gap: 14px; text-align: left; padding: 16px 20px; min-width: unset; }
    .profile-avatar, .mode-icon { width: 52px; height: 52px; font-size: 1.7rem; flex-shrink: 0; }
    .game-card { padding: 20px 16px; }
    .question-text { font-size: 1.5rem; }
    .hint-text { font-size: 0.95rem; margin-bottom: 14px; min-height: 30px; }
    .game-input { font-size: 16px; max-width: 100%; padding: 12px; }
    .btn { padding: 12px 24px; font-size: 0.95rem; min-height: 46px; }
    .teddy-visual { font-size: 2.7rem; letter-spacing: 4px; }
    .teddy-choice { padding: 18px 12px; font-size: 1.7rem; min-height: 78px; }
    .teddy-prompt { font-size: 1.25rem; }
    .topbar { gap: 6px; }
  }

  /* Compact layout when mobile keyboard is open */
  .keyboard-open .topbar { margin-bottom: 6px; }
  .keyboard-open .topic-chip { margin-bottom: 6px; padding: 3px 12px; font-size: 0.75rem; }
  .keyboard-open .game-card { padding: 14px 12px; }
  .keyboard-open .hint-text { font-size: 0.85rem; margin-bottom: 8px; min-height: unset; }
  .keyboard-open .question-text { font-size: 1.2rem; min-height: unset; margin-bottom: 4px; }
  .keyboard-open .question-visual { display: none; }
  .keyboard-open .feedback { min-height: unset; margin-top: 6px; font-size: 0.95rem; }
  .keyboard-open .correct-answer { font-size: 1.1rem; margin-top: 4px; }
  .keyboard-open .action-row { margin-top: 8px; }
  .keyboard-open .btn { padding: 10px 22px; font-size: 0.9rem; min-height: 42px; }
</style>
</head>
<body>

<!-- ===== SCREEN: PROFILE SELECT ===== -->
<div class="screen active" id="screen-select">
  <h1 class="brand">🎓 <span class="cap">L</span>earning <span class="l1">C</span><span class="l2">l</span><span class="l3">u</span>b</h1>
  <p class="tagline">A little every day goes a long way ✨</p>
  <div class="profiles">
    <button class="profile-btn" onclick="selectPlayer('elsie')">
      <div class="profile-avatar av-elsie">👑</div>
      <div class="profile-name">Elsie</div>
      <div class="profile-info" id="elsie-info">4th Class</div>
    </button>
    <button class="profile-btn" onclick="selectPlayer('freya')">
      <div class="profile-avatar av-freya">🐱</div>
      <div class="profile-name">Freya</div>
      <div class="profile-info" id="freya-info">2nd Class</div>
    </button>
    <button class="profile-btn" onclick="selectPlayer('teddy')">
      <div class="profile-avatar av-teddy">🧸</div>
      <div class="profile-name">Teddy</div>
      <div class="profile-info" id="teddy-info">Little Explorer</div>
    </button>
  </div>
  <div class="homefoot">
    <button class="linkbtn" onclick="showParent()">👪 For parents</button>
  </div>
</div>

<!-- ===== SCREEN: MODE SELECT ===== -->
<div class="screen" id="screen-mode">
  <div class="topbar">
    <div class="left"><button class="nav-pill" onclick="goHome()">← Switch player</button></div>
    <div class="right" id="mode-daily"></div>
  </div>
  <h1 class="brand" id="mode-title">What shall we practise? 🤔</h1>
  <p class="tagline" id="mode-subtitle"></p>
  <div class="modes">
    <button class="mode-btn" onclick="startGame('spelling')">
      <div class="mode-icon av-spelling">📝</div>
      <div class="mode-name">Spelling</div>
      <div class="mode-info" id="spelling-level-info"></div>
    </button>
    <button class="mode-btn" onclick="startGame('maths')">
      <div class="mode-icon av-maths">🔢</div>
      <div class="mode-name">Maths</div>
      <div class="mode-info" id="maths-level-info"></div>
    </button>
  </div>
</div>

<!-- ===== SCREEN: GAME (Elsie/Freya) ===== -->
<div class="screen" id="screen-game">
  <div class="topbar">
    <div class="left">
      <button class="nav-pill" onclick="goModeSelect()">←</button>
      <div class="who-chip" id="player-tag"><div class="avatar-sm" id="player-avatar"></div><span id="player-name-tag"></span></div>
    </div>
    <div class="right">
      <div class="streak-chip" id="daystreak-chip">🔥 0</div>
      <div class="ringwrap" id="ringwrap">
        <svg width="48" height="48" viewBox="0 0 48 48">
          <circle class="ring-track" cx="24" cy="24" r="19" fill="none" stroke-width="5"></circle>
          <circle class="ring-fill" id="ring-fill" cx="24" cy="24" r="19" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="119.4"></circle>
        </svg>
        <div class="ring-label" id="ring-label">0</div>
      </div>
    </div>
  </div>

  <div class="topic-chip" id="topic-chip"></div>

  <div class="game-card">
    <div class="question-text" id="question-text" style="display:none"></div>
    <div class="question-visual" id="question-visual" style="display:none"></div>
    <div class="hint-text" id="hint-text"></div>
    <div class="input-row">
      <button class="btn btn-hear" id="btn-hear" onclick="hearWord()" title="Hear the word again">🔊</button>
      <input type="text" id="game-input" class="game-input" placeholder="Type your answer..." autocomplete="off" autocapitalize="none" spellcheck="false">
    </div>
    <div class="action-row">
      <button class="btn btn-primary" id="btn-check" onclick="checkAnswer()">Check ✓</button>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="correct-answer" id="correct-answer"></div>
  </div>
</div>

<!-- ===== SCREEN: TEDDY ===== -->
<div class="screen" id="screen-teddy">
  <div class="topbar">
    <div class="left">
      <button class="nav-pill" onclick="goHome()">←</button>
      <div class="who-chip"><div class="avatar-sm av-teddy">🧸</div><span>Teddy</span></div>
    </div>
    <div class="right">
      <div class="streak-chip" id="teddy-daystreak">🔥 0</div>
    </div>
  </div>
  <div class="teddy-stars" id="teddy-stars"></div>
  <div class="game-card">
    <div class="teddy-prompt" id="teddy-prompt"></div>
    <div class="teddy-visual" id="teddy-visual"></div>
    <div class="teddy-choices" id="teddy-choices"></div>
    <div class="teddy-feedback" id="teddy-feedback"></div>
  </div>
</div>

<!-- ===== SCREEN: PARENT ===== -->
<div class="screen" id="screen-parent">
  <div class="p-head">
    <h2>👪 Parent view</h2>
    <button class="nav-pill" onclick="goHome()">← Back</button>
  </div>
  <div id="parent-content"></div>
</div>

<!-- ===== DONE OVERLAY ===== -->
<div class="overlay" id="done-overlay">
  <div class="big">🎉</div>

const NB_COLOURS = {

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function makeDistractors(correct, pool, count) {
  const options = pool.filter(x => x !== correct);
  const shuffled = shuffleArray(options);
  const result = [correct, ...shuffled.slice(0, count - 1)];
  return shuffleArray(result);
}

function makeNumberDistractors(correct, min, max, count) {
  const options = [correct];
  while (options.length < count) {
    const n = rand(min, max);
    if (!options.includes(n)) options.push(n);
  }
  return shuffleArray(options.map(String));
}

function makeCountVisual(count, emoji) {
  if (count <= 5) return (emoji + ' ').repeat(count).trim();
  return (emoji + ' ').repeat(5).trim() + '  ' + (emoji + ' ').repeat(count - 5).trim();
}

function makeBlockTower(n, showLabel) {
  if (showLabel === undefined) showLabel = true;
  const col = NB_COLOURS[n] || NB_COLOURS[Math.min(n, 10)];
  const isGradient = col.includes('gradient');
  const style = isGradient ? 'background:' + col : 'background-color:' + col;
  let blocks = '';
  for (let i = 0; i < n; i++) blocks += '<div class="nb-block" style="' + style + '"></div>';
  let label = showLabel ? '<div class="nb-label">' + n + '</div>' : '';
  return '<div class="nb-tower">' + blocks + label + '</div>';
}

function makeBlockArray(rows, cols) {
  const col = NB_COLOURS[rows] || NB_COLOURS[Math.min(rows, 10)];
  const isGradient = col.includes('gradient');
  const style = isGradient ? 'background:' + col : 'background-color:' + col;
  let cells = '';
  for (let i = 0; i < rows * cols; i++) cells += '<div class="nb-block" style="' + style + '"></div>';
  return '<div class="nb-array" style="grid-template-columns:repeat(' + cols + ',24px)">' + cells + '</div>';
}

function makeAdditionVisual(a, b) {
  return '<div class="nb-sum">' + makeBlockTower(a) + '<span class="nb-op">+</span>' + makeBlockTower(b) +
    '<span class="nb-op">=</span><span class="nb-op">?</span></div>';
}

function makeMultiplicationVisual(a, b) {
  return '<div style="text-align:center">' + makeBlockArray(a, b) +
    '<div class="nb-array-label">' + a + ' × ' + b + '</div></div>';
}

function makeClockFace(hour, minute) {
  var h = hour % 12;
  var mAngle = minute * 6;
  var hAngle = h * 30 + minute * 0.5;
  var mRad = (mAngle - 90) * Math.PI / 180;
  var hRad = (hAngle - 90) * Math.PI / 180;
  var mx = 50 + 35 * Math.cos(mRad), my = 50 + 35 * Math.sin(mRad);
  var hx = 50 + 24 * Math.cos(hRad), hy = 50 + 24 * Math.sin(hRad);
  var nums = '';
  for (var i = 1; i <= 12; i++) {
    var a = (i * 30 - 90) * Math.PI / 180;
    var nx = 50 + 40 * Math.cos(a), ny = 50 + 40 * Math.sin(a);
    nums += '<text x="'+nx+'" y="'+ny+'" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#202124">'+i+'</text>';
  }
  return '<svg viewBox="0 0 100 100" width="120" height="120" style="background:white;border-radius:50%;border:3px solid #202124">' +
    '<circle cx="50" cy="50" r="48" fill="white"/>' + nums +
    '<line x1="50" y1="50" x2="'+hx+'" y2="'+hy+'" stroke="#202124" stroke-width="4" stroke-linecap="round"/>' +
    '<line x1="50" y1="50" x2="'+mx+'" y2="'+my+'" stroke="#1a73e8" stroke-width="2.5" stroke-linecap="round"/>' +
    '<circle cx="50" cy="50" r="3" fill="#202124"/></svg>';
}

function formatClockAnswer(hour, minute) {
  var h12 = hour % 12 || 12;
  if (minute === 0) return h12 + " o'clock";
  if (minute === 15) return 'quarter past ' + h12;
  if (minute === 30) return 'half past ' + h12;
  if (minute === 45) return 'quarter to ' + ((h12 % 12) + 1);
  if (minute < 30) return minute + ' past ' + h12;
  return (60 - minute) + ' to ' + ((h12 % 12) + 1);
}

function makeClockAlts(hour, minute) {
  var h12 = hour % 12 || 12;
  var alts = [];
  var hh = String(h12), mm = String(minute).padStart(2, '0');
  alts.push(hh + ':' + mm);
  if (minute === 0) alts.push(h12 + " oclock", h12 + ":00");
  if (minute === 15) alts.push('15 past ' + h12);
  if (minute === 30) alts.push('30 past ' + h12);
  if (minute === 45) { var next = (h12 % 12) + 1; alts.push('15 to ' + next, '45 past ' + h12); }
  if (minute > 30 && minute !== 45) { var next2 = (h12 % 12) + 1; alts.push((60 - minute) + ' to ' + next2); }
  return alts;
}

const TEDDY_TAGS = {
  1: ['counting','block-count','addition','colours','shapes','number-recog'],
  2: ['counting','block-count','addition','colours','shapes','number-recog','letter-sound','letter-tap'],
  3: ['counting','block-count','addition','mult-array','number-recog','colours','shapes','letter-sound','letter-tap','more-less']
};

const CORRECT_MSGS = ["Brilliant! 🎉", "Nailed it! 💪", "Perfect! ⭐", "Amazing! 🌟", "You legend! 🏆", "Spot on! 🎯", "Superb! 🚀", "Class! 👏", "Deadly! 🔥", "Well done! 🎈"];
const WRONG_MSGS = ["Close! 🤞", "Nearly! 💪", "Good try! 🌱", "Almost! 👊", "Keep going! 🚀"];
const TEDDY_CORRECT = ["Well done Teddy!", "Brilliant!", "You're a star!", "Amazing!", "Super!", "Yay!"];

// =====================================================================
// SCHEDULER — spaced repetition on the topic graph
// =====================================================================
const DAY = 86400000;
const INTERVALS = [0, 1, 3, 7, 14, 30, 60];   // days at each strength 0-6
const FLUENT = { facts:7000, mental:15000, written:40000, word:40000, visual:15000 };
const GOALS = { elsie:30, freya:30, teddy:10 };
const CLASS_INFO = { elsie:'4th Class', freya:'2nd Class', teddy:'Little Explorer' };

function todayStr(offset) {
  const d = new Date(Date.now() + (offset||0));
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function freshDaily() { return { date:'', pts:0, streak:0, lastGoal:'', hist:{}, done:false }; }

function loadChild(name) {
  let p = null;
  try { p = JSON.parse(localStorage.getItem('lc_' + name) || 'null'); } catch(e) {}
  if (!p) p = migrateChild(name);
  if (!p.daily) p.daily = freshDaily();
  rollDaily(p);
  return p;
}

function saveChild(p) { localStorage.setItem('lc_' + p.name, JSON.stringify(p)); }

// Migrate v1 localStorage profiles (maths_<name> / spelling_<name>) — a child
// at old level L gets everything below band L seeded as known-but-due-soon,
// so they carry on where they were and old material returns as review.
function migrateChild(name) {
  const p = { v:2, name:name, topics:{}, spelling:{ band:1, words:{} }, daily:freshDaily(), score:0, streak:0, bestStreak:0 };
  if (name === 'teddy') return p;
  let oldM = null, oldS = null;
  try { oldM = JSON.parse(localStorage.getItem('maths_' + name) || 'null'); } catch(e) {}
  try { oldS = JSON.parse(localStorage.getItem('spelling_' + name) || 'null'); } catch(e) {}
  const defaultBand = name === 'elsie' ? 3 : 1;
  const mBand = oldM ? oldM.level : defaultBand;
  p.spelling.band = Math.min(oldS ? oldS.level : defaultBand, 5);
  p.score = (oldM ? oldM.score || 0 : 0) + (oldS ? oldS.score || 0 : 0);
  p.bestStreak = Math.max(oldM ? oldM.bestStreak || 0 : 0, oldS ? oldS.bestStreak || 0 : 0);
  TOPICS.forEach(t => {
    if (t.band < mBand) {
      p.topics[t.id] = { s:3, due: Date.now() + rand(0,3) * DAY, r:2, w:0, reps:2, ema:null, credit:0 };
    }
  });
  return p;
}

function topicState(p, id) {
  if (!p.topics[id]) p.topics[id] = { s:0, due:0, r:0, w:0, reps:0, ema:null, credit:0 };
  return p.topics[id];
}

function isUnlocked(p, t) {
  return t.prereqs.every(id => (p.topics[id] || {s:0}).s >= 2);
}

function topicStatus(p, t) {
  const st = p.topics[t.id];
  if (!st || st.reps === 0) return isUnlocked(p, t) ? 'new' : 'locked';
  const n = st.r + st.w;
  const rate = n ? st.r / n : 0;
  if (n >= 3 && rate < 0.6) return 'shaky';
  if (st.s >= 5) return 'mastered';
  if (st.s >= 3) return 'solid';
  return 'learning';
}

function weightedPick(items, weights) {
  const total = weights.reduce((a,b) => a+b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < items.length; i++) { r -= weights[i]; if (r <= 0) return items[i]; }
  return items[items.length - 1];
}

// Selection: in-session retries first, then due reviews, then the frontier.
function selectMathsTopic(p) {
  const now = Date.now();
  for (let i = 0; i < mathsRequeue.length; i++) {
    if (mathsRequeue[i].after <= qCount && mathsRequeue[i].id !== lastTopics[lastTopics.length-1]) {
      return TOPIC_MAP[mathsRequeue.splice(i,1)[0].id];
    }
  }
  const avail = TOPICS.filter(t => isUnlocked(p, t) && !lastTopics.includes(t.id));
  const due = avail.filter(t => { const st = p.topics[t.id]; return st && st.reps > 0 && st.due <= now && st.s < 6; });
  if (due.length) {
    due.sort((a,b) => p.topics[a.id].due - p.topics[b.id].due);
    return pick(due.slice(0, 3));
  }
  let frontier = avail.filter(t => { const st = p.topics[t.id]; return !st || st.s < 2; });
  if (frontier.length) {
    // learn in curriculum order: only open the lowest band that still has work
    const minBand = Math.min.apply(null, frontier.map(t => t.band));
    frontier = frontier.filter(t => t.band <= minBand + 1);
    const weights = frontier.map(t => {
      const st = p.topics[t.id];
      if (!st || st.r + st.w < 3) return 1.5;
      const rate = st.r / (st.r + st.w);
      return Math.max(0.3, Math.min(3, 1 / (rate + 0.1)));
    });
    return weightedPick(frontier, weights);
  }
  const all = TOPICS.filter(t => isUnlocked(p, t));
  all.sort((a,b) => ((p.topics[a.id]||{due:0}).due) - ((p.topics[b.id]||{due:0}).due));
  return all.find(t => !lastTopics.includes(t.id)) || all[0];
}

// Implicit credit: a correct answer on an advanced topic counts as a
// fractional repetition on the topics inside it (Math Academy's FIRe idea).
function applyCredit(p, t) {
  const enc = t.enc || {};
  Object.keys(enc).forEach(id => {
    const est = topicState(p, id);
    if (est.reps === 0) return;
    est.credit = (est.credit || 0) + enc[id];
    while (est.credit >= 1) {
      est.credit -= 1;
      est.r++; est.reps++;
      est.due = Math.max(est.due, Date.now() + INTERVALS[est.s] * DAY * 0.75);
    }
  });
}

// Returns true if the answer was fluent (fast enough for its family)
function gradeMathsAnswer(p, t, correct, ms) {
  const st = topicState(p, t.id);
  const now = Date.now();
  st.reps++;
  if (correct) {
    st.r++;
    const fluent = ms <= FLUENT[t.fam];
    st.ema = st.ema == null ? ms : Math.round(st.ema * 0.7 + ms * 0.3);
    let ns = st.s + 1;
    // learned but not fluent → no progress past 2, but never demote on a correct answer
    if (t.fam === 'facts' && !fluent) ns = Math.min(ns, Math.max(st.s, 2));
    st.s = Math.min(ns, 6);
    st.due = now + INTERVALS[st.s] * DAY * (0.9 + Math.random() * 0.2);
    applyCredit(p, t);
    if (st.s >= 5 && !st.m) { st.m = 1; showToast('🏆 Mastered: ' + t.emoji + ' ' + t.name + '!'); }
    return fluent;
  } else {
    st.w++;
    st.s = Math.max(0, st.s - 2);
    st.due = now;
    mathsRequeue.push({ id: t.id, after: qCount + 3 });
    return false;
  }
}

// ---- spelling scheduler ----
function findWordObj(w) {
  for (let b = 1; b <= 5; b++) { const m = WORDS[b].find(x => x.word === w); if (m) return m; }
  return null;
}

function selectWord(p) {
  const sp = p.spelling;
  const now = Date.now();
  for (let i = 0; i < spellRequeue.length; i++) {
    if (spellRequeue[i].after <= qCount && spellRequeue[i].word !== lastWord) {
      const w = spellRequeue.splice(i,1)[0].word;
      const obj = findWordObj(w);
      if (obj) return obj;
    }
  }
  const due = Object.keys(sp.words).filter(w => sp.words[w].due <= now && sp.words[w].s < 6 && w !== lastWord);
  if (due.length) {
    due.sort((a,b) => sp.words[a].due - sp.words[b].due);
    const obj = findWordObj(pick(due.slice(0, 4)));
    if (obj) return obj;
  }
  const bank = WORDS[sp.band];
  const fresh = bank.filter(x => !sp.words[x.word]);
  if (fresh.length) return pick(fresh);
  const solid = bank.filter(x => sp.words[x.word] && sp.words[x.word].s >= 2).length;
  if (solid >= Math.ceil(bank.length * 0.8) && sp.band < 5) {
    sp.band++;
    showToast('📚 New words unlocked! Band ' + sp.band + ' 🎉');
    return pick(WORDS[sp.band]);
  }
  const all = Object.keys(sp.words).filter(w => w !== lastWord);
  if (all.length) { all.sort((a,b) => sp.words[a].due - sp.words[b].due); return findWordObj(all[0]) || bank[0]; }
  return bank[0];
}

function gradeWordAnswer(p, word, correct) {
  const sp = p.spelling;
  if (!sp.words[word]) sp.words[word] = { s:0, due:0, r:0, w:0 };
  const ws = sp.words[word];
  const now = Date.now();
  if (correct) {
    ws.r++;
    ws.s = Math.min(ws.s + 1, 6);
    ws.due = now + INTERVALS[ws.s] * DAY * (0.9 + Math.random() * 0.2);
  } else {
    ws.w++;
    ws.s = 0;
    ws.due = now;
    spellRequeue.push({ word: word, after: qCount + 3 });
  }
}

// ---- daily loop ----
function rollDaily(p) {
  const t = todayStr();
  if (p.daily.date !== t) { p.daily.date = t; p.daily.pts = 0; p.daily.done = false; }
}

function addPoints(p, n) {
  rollDaily(p);
  p.daily.pts += n;
  p.daily.hist[p.daily.date] = p.daily.pts;
  const keys = Object.keys(p.daily.hist).sort();
  while (keys.length > 40) delete p.daily.hist[keys.shift()];
  const goal = GOALS[p.name] || 30;
  if (p.daily.pts >= goal && !p.daily.done) {
    p.daily.done = true;
    p.daily.streak = (p.daily.lastGoal === todayStr(-DAY)) ? p.daily.streak + 1 : 1;
    p.daily.lastGoal = p.daily.date;
    saveChild(p);
    setTimeout(() => showDone(p), 600);
  }
}

// =====================================================================
// STATE + NAVIGATION
// =====================================================================
let currentPlayerName = null;
let currentMode = null;
let profile = null;            // lc_<name> profile for current child
let teddyProfile = null;       // legacy level-based profile for Teddy
let currentQuestion = null;
let currentTopic = null;
let lastTopics = [];
let lastWord = null;
let mathsRequeue = [];
let spellRequeue = [];
let lastTeddyTags = [];
let missedTeddyTypes = [];
let qCount = 0;
let qStart = 0;
let waiting = false;

const AVATARS = { elsie:'👑', freya:'🐱', teddy:'🧸' };

function init() { updateProfileInfo(); }

function childSummary(name) {
  const p = loadChild(name);
  const goal = GOALS[name] || 30;
  return CLASS_INFO[name] + '<br>🔥 ' + (p.daily.streak || 0) + ' · ⭐ ' + p.daily.pts + '/' + goal;
}

function updateProfileInfo() {
  document.getElementById('elsie-info').innerHTML = childSummary('elsie');
  document.getElementById('freya-info').innerHTML = childSummary('freya');
  document.getElementById('teddy-info').innerHTML = childSummary('teddy');
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function goHome() {
  if (profile) saveChild(profile);
  updateProfileInfo();
  showScreen('screen-select');
  currentPlayerName = null; currentMode = null; profile = null;
  lastTopics = []; mathsRequeue = []; spellRequeue = []; lastWord = null;
  lastTeddyTags = []; missedTeddyTypes = [];
}

function goModeSelect() {
  if (profile) saveChild(profile);
  selectPlayer(currentPlayerName);
}

function selectPlayer(name) {
  currentPlayerName = name;
  if (name === 'teddy') { startTeddyGame(); return; }
  profile = loadChild(name);
  const displayName = name === 'elsie' ? 'Elsie' : 'Freya';
  document.getElementById('mode-subtitle').textContent = displayName + "'s turn! ✨";
  const mastered = TOPICS.filter(t => (profile.topics[t.id]||{s:0}).s >= 5).length;
  const wordsSolid = Object.keys(profile.spelling.words).filter(w => profile.spelling.words[w].s >= 3).length;
  document.getElementById('spelling-level-info').textContent = '📚 Band ' + profile.spelling.band + ' · ' + wordsSolid + ' words solid';
  document.getElementById('maths-level-info').textContent = '🏆 ' + mastered + '/' + TOPICS.length + ' topics mastered';
  document.getElementById('mode-daily').innerHTML = '<div class="streak-chip">🔥 ' + (profile.daily.streak||0) + ' · ⭐ ' + profile.daily.pts + '/' + (GOALS[name]||30) + '</div>';
  showScreen('screen-mode');
}

// =====================================================================
// GAME FLOW (Elsie / Freya)
// =====================================================================
function startGame(mode) {
  currentMode = mode;
  qCount = 0;
  showScreen('screen-game');
  const av = document.getElementById('player-avatar');
  av.className = 'avatar-sm av-' + currentPlayerName;
  av.textContent = AVATARS[currentPlayerName];
  document.getElementById('player-name-tag').textContent = currentPlayerName === 'elsie' ? 'Elsie' : 'Freya';

  const input = document.getElementById('game-input');
  if (mode === 'spelling') {
    input.className = 'game-input spelling-input';
    input.placeholder = 'Type the word...';
    document.getElementById('btn-hear').style.display = 'flex';
  } else {
    input.className = 'game-input';
    input.placeholder = 'Type your answer...';
    document.getElementById('btn-hear').style.display = 'none';
  }
  updateRing();
  nextQuestion();
}

function updateRing() {
  if (!profile) return;
  const goal = GOALS[profile.name] || 30;
  const pts = profile.daily.pts;
  const frac = Math.min(1, pts / goal);
  const C = 119.4;
  document.getElementById('ring-fill').style.strokeDashoffset = String(C * (1 - frac));
  document.getElementById('ring-label').textContent = pts + '/' + goal;
  document.getElementById('ringwrap').classList.toggle('done', pts >= goal);
  document.getElementById('daystreak-chip').textContent = '🔥 ' + (profile.daily.streak || 0);
}

function setTopicChip(t, st) {
  const el = document.getElementById('topic-chip');
  if (currentMode === 'spelling') {
    el.innerHTML = '📝 Spelling · Band ' + profile.spelling.band;
    return;
  }
  let note = '';
  if (!st || st.reps === 0) note = ' · <span class="tc-note">New ✨</span>';
  else if (st.due <= Date.now()) note = ' · <span class="tc-note">Review 🔁</span>';
  el.innerHTML = t.emoji + ' ' + t.name + note;
}

function nextQuestion() {
  waiting = false;
  qCount++;
  const input = document.getElementById('game-input');
  input.value = '';
  input.className = currentMode === 'spelling' ? 'game-input spelling-input' : 'game-input';
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('correct-answer').textContent = '';
  document.getElementById('btn-check').textContent = 'Check ✓';
  document.getElementById('btn-check').onclick = checkAnswer;
  input.disabled = false;

  if (currentMode === 'spelling') {
    document.getElementById('question-text').style.display = 'none';
    document.getElementById('question-visual').style.display = 'none';
    document.getElementById('question-visual').innerHTML = '';
    document.getElementById('hint-text').style.display = 'block';
    const picked = selectWord(profile);
    currentQuestion = { word: picked.word, hint: picked.hint, answer: picked.word.toLowerCase() };
    lastWord = picked.word;
    setTopicChip();
    input.inputMode = 'text';
    document.getElementById('hint-text').innerHTML = picked.hint;
    setTimeout(() => hearWord(), 400);
  } else {
    document.getElementById('question-text').style.display = 'block';
    document.getElementById('hint-text').style.display = 'block';
    currentTopic = selectMathsTopic(profile);
    setTopicChip(currentTopic, profile.topics[currentTopic.id]);
    lastTopics.push(currentTopic.id);
    if (lastTopics.length > 2) lastTopics.shift();
    currentQuestion = pick(currentTopic.gens)();
    input.inputMode = /^[0-9.]+$/.test(String(currentQuestion.answer)) ? 'decimal' : 'text';
    document.getElementById('question-text').textContent = currentQuestion.question;
    document.getElementById('hint-text').textContent = currentQuestion.hint;
    const vizEl = document.getElementById('question-visual');
    if (currentQuestion.visual) { vizEl.style.display = 'flex'; vizEl.innerHTML = currentQuestion.visual; }
    else { vizEl.style.display = 'none'; vizEl.innerHTML = ''; }
  }
  qStart = Date.now();
  input.focus();
}

function getIrishVoice() {
  const voices = window.speechSynthesis.getVoices();
  return voices.find(v => v.lang === 'en-IE')
    || voices.find(v => v.lang.startsWith('en-IE'))
    || voices.find(v => v.name.toLowerCase().includes('moira'))
    || voices.find(v => v.lang.startsWith('en-GB'))
    || voices.find(v => v.lang.startsWith('en'));
}

function speakText(text, rate) {
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = rate || 0.9;
  const voice = getIrishVoice();
  if (voice) utter.voice = voice;
  window.speechSynthesis.speak(utter);
}

function hearWord() {
  if (!currentQuestion || currentMode !== 'spelling') return;
  speakText(currentQuestion.word, 0.85);
}

function checkAnswer() {
  if (waiting) return;
  const input = document.getElementById('game-input');
  const raw = input.value.trim();
  if (!raw) return;

  const ms = Math.min(Date.now() - qStart, 120000);
  let correct = false;

  if (currentMode === 'spelling') {
    correct = raw.toLowerCase() === currentQuestion.answer;
  } else {
    const userAns = raw.replace(/\s/g, '').toLowerCase();
    const expected = String(currentQuestion.answer).replace(/\s/g, '').toLowerCase();
    correct = userAns === expected;
    if (!correct && currentQuestion.acceptAlt) {
      correct = currentQuestion.acceptAlt.some(alt => userAns === String(alt).replace(/\s/g, '').toLowerCase());
    }
    if (!correct) {
      const userNum = parseFloat(userAns), expNum = parseFloat(expected);
      if (!isNaN(userNum) && !isNaN(expNum) && Math.abs(userNum - expNum) < 0.01) correct = true;
    }
  }

  const p = profile;
  const fb = document.getElementById('feedback');

  if (correct) {
    input.classList.add('correct');
    p.score++;
    p.streak++;
    if (p.streak > p.bestStreak) p.bestStreak = p.streak;
    let pts = 2;
    if (currentMode === 'maths') {
      const fluent = gradeMathsAnswer(p, currentTopic, true, ms);
      if (fluent && currentTopic.fam === 'facts') pts = 3;
    } else {
      gradeWordAnswer(p, currentQuestion.word, true);
    }
    let msg = pick(CORRECT_MSGS);
    if (p.streak >= 3) msg += ' ⚡' + p.streak + ' in a row!';
    fb.innerHTML = msg + (pts === 3 ? '<span class="bonus">⚡ Lightning fast! Bonus point</span>' : '');
    fb.className = 'feedback correct-fb';
    spawnConfetti();
    addPoints(p, pts);
  } else {
    input.classList.add('wrong');
    fb.textContent = pick(WRONG_MSGS);
    fb.className = 'feedback wrong-fb';
    if (currentMode === 'spelling') {
      document.getElementById('correct-answer').textContent = currentQuestion.word;
      gradeWordAnswer(p, currentQuestion.word, false);
      setTimeout(() => speakText(currentQuestion.word, 0.7), 300);
    } else {
      const q = currentQuestion.question.replace(' = ?', '');
      document.getElementById('correct-answer').textContent = q + ' = ' + currentQuestion.answer;
      gradeMathsAnswer(p, currentTopic, false, ms);
    }
    p.streak = 0;
  }

  saveChild(p);
  updateRing();
  waiting = true;
  document.getElementById('btn-check').textContent = 'Next →';
  document.getElementById('btn-check').onclick = () => nextQuestion();
  input.disabled = true;
}

// =====================================================================
// TEDDY — keeps its v1 adaptive levels, gains the daily star goal
// =====================================================================
function getTeddyProfile() {
  const stored = localStorage.getItem('mixed_teddy');
  if (stored) {
    const p = JSON.parse(stored);
    if (!p.recentAnswers) p.recentAnswers = [];
    if (!p.typeStats) p.typeStats = {};
    return p;
  }
  return { name:'teddy', mode:'mixed', level:1, score:0, streak:0, bestStreak:0, recentAnswers:[], typeStats:{} };
}
function saveTeddyProfile(p) { localStorage.setItem('mixed_teddy', JSON.stringify(p)); }

const WINDOW_SIZE = 8, LEVEL_UP_THRESHOLD = 6, LEVEL_DOWN_THRESHOLD = 2, MIN_ANSWERS_FOR_DOWN = 6;

function checkAdaptive(p, maxLevel) {
  const recent = p.recentAnswers || [];
  if (recent.length < WINDOW_SIZE) return null;
  const correct = recent.filter(Boolean).length;
  if (correct >= LEVEL_UP_THRESHOLD && p.level < maxLevel) return 'up';
  if (correct <= LEVEL_DOWN_THRESHOLD && recent.length >= MIN_ANSWERS_FOR_DOWN && p.level > 1) return 'down';
  return null;
}

function recordAnswer(p, isCorrect) {
  if (!p.recentAnswers) p.recentAnswers = [];
  p.recentAnswers.push(isCorrect);
  if (p.recentAnswers.length > WINDOW_SIZE) p.recentAnswers.shift();
}

function recordTypeResult(p, level, tag, isCorrect) {
  if (!p.typeStats) p.typeStats = {};
  const key = level + ':' + tag;
  if (!p.typeStats[key]) p.typeStats[key] = { right: 0, wrong: 0 };
  const s = p.typeStats[key];
  if (isCorrect) s.right++; else s.wrong++;
  if (s.right + s.wrong > 20) { s.right = Math.floor(s.right/2); s.wrong = Math.floor(s.wrong/2); }
}

function selectWeighted(generators, tags, p, level, lTags, missedTypes) {
  const stats = p.typeStats || {};
  const weights = generators.map(function(gen, i) {
    const key = level + ':' + tags[i];
    const s = stats[key];
    if (!s || (s.right + s.wrong) < 3) return 1.5;
    var rate = s.right / (s.right + s.wrong);
    return Math.max(0.3, Math.min(3.0, 1 / (rate + 0.1)));
  });
  var missed = missedTypes || [];
  weights.forEach(function(w, i) {
    var count = missed.filter(function(t) { return t === tags[i]; }).length;
    if (count > 0) weights[i] *= (1 + count * 0.5);
  });
  if (lTags && lTags.length > 0) {
    var hasNonZero = false;
    weights.forEach(function(w, i) {
      if (lTags.includes(tags[i])) weights[i] = 0;
      else if (w > 0) hasNonZero = true;
    });
    if (!hasNonZero) {
      generators.forEach(function(g, i) {
        var key = level + ':' + tags[i];
        var s = stats[key];
        weights[i] = (!s || (s.right+s.wrong)<3) ? 1.5 : Math.max(0.3, Math.min(3.0, 1/(s.right/(s.right+s.wrong)+0.1)));
      });
    }
  }
  var total = weights.reduce(function(a,b){return a+b;}, 0);
  var r = Math.random() * total;
  for (var i = 0; i < generators.length; i++) {
    r -= weights[i];
    if (r <= 0) return { gen: generators[i], idx: i, tag: tags[i] };
  }
  return { gen: generators[generators.length-1], idx: generators.length-1, tag: tags[tags.length-1] };
}

function startTeddyGame() {
  teddyProfile = getTeddyProfile();
  profile = loadChild('teddy');
  showScreen('screen-teddy');
  document.getElementById('teddy-daystreak').textContent = '🔥 ' + (profile.daily.streak || 0);
  updateTeddyStars();
  nextTeddyQuestion();
}

function updateTeddyStars() {
  const el = document.getElementById('teddy-stars');
  const goal = GOALS.teddy;
  const filled = Math.min(profile.daily.pts, goal);
  el.textContent = '⭐'.repeat(filled) + '☆'.repeat(Math.max(0, goal - filled));
  if (profile.daily.pts >= goal) el.textContent = '🌟🎉 Super Star! 🎉🌟';
}

function nextTeddyQuestion() {
  waiting = false;
  document.getElementById('teddy-feedback').textContent = '';
  document.getElementById('teddy-feedback').className = 'teddy-feedback';
  const level = teddyProfile.level || 1;
  const generators = TEDDY_Q[level] || TEDDY_Q[1];
  const tags = TEDDY_TAGS[level] || TEDDY_TAGS[1];
  const sel = selectWeighted(generators, tags, teddyProfile, level, lastTeddyTags, missedTeddyTypes);
  currentQuestion = sel.gen();
  currentQuestion._tag = sel.tag;
  lastTeddyTags.push(sel.tag);
  if (lastTeddyTags.length > 2) lastTeddyTags.shift();

  document.getElementById('teddy-prompt').textContent = currentQuestion.prompt;
  const visualEl = document.getElementById('teddy-visual');
  if (currentQuestion.visualIsHTML) visualEl.innerHTML = currentQuestion.visual || '';
  else visualEl.textContent = currentQuestion.visual || '';

  const choicesEl = document.getElementById('teddy-choices');
  choicesEl.innerHTML = '';
  currentQuestion.choices.forEach((choice) => {
    const btn = document.createElement('button');
    btn.className = 'teddy-choice';
    btn.textContent = choice;
    btn.onclick = () => checkTeddyAnswer(choice, btn);
    choicesEl.appendChild(btn);
  });
  setTimeout(() => speakText(currentQuestion.speak, 0.85), 400);
}

function checkTeddyAnswer(chosen, btnEl) {
  if (waiting) return;
  waiting = true;
  const correct = chosen === currentQuestion.answer;
  const p = teddyProfile;
  const feedbackEl = document.getElementById('teddy-feedback');
  const allBtns = document.querySelectorAll('#teddy-choices .teddy-choice');
  allBtns.forEach(b => b.classList.add('disabled'));

  if (correct) {
    btnEl.classList.add('correct-choice');
    feedbackEl.textContent = pick(TEDDY_CORRECT);
    feedbackEl.className = 'teddy-feedback correct-fb';
    p.score++; p.streak++;
    if (p.streak > p.bestStreak) p.bestStreak = p.streak;
    recordAnswer(p, true);
    recordTypeResult(p, p.level, currentQuestion._tag, true);
    var mi = missedTeddyTypes.indexOf(currentQuestion._tag);
    if (mi !== -1) missedTeddyTypes.splice(mi, 1);
    spawnConfetti();
    addPoints(profile, 1);
    saveChild(profile);
    updateTeddyStars();
    document.getElementById('teddy-daystreak').textContent = '🔥 ' + (profile.daily.streak || 0);
    setTimeout(() => speakText(pick(TEDDY_CORRECT), 0.9), 200);
    const adaptive = checkAdaptive(p, 3);
    if (adaptive === 'up') { p.level++; p.recentAnswers = []; saveTeddyProfile(p); setTimeout(() => nextTeddyQuestion(), 2000); return; }
    saveTeddyProfile(p);
    setTimeout(() => nextTeddyQuestion(), 1500);
  } else {
    btnEl.classList.add('wrong-choice');
    const spokenAnswer = currentQuestion.speakAnswer || currentQuestion.answer;
    feedbackEl.textContent = "Nearly! It's " + spokenAnswer;
    feedbackEl.className = 'teddy-feedback wrong-fb';
    allBtns.forEach(b => { if (b.textContent === currentQuestion.answer) b.classList.add('correct-choice'); });
    p.streak = 0;
    recordAnswer(p, false);
    recordTypeResult(p, p.level, currentQuestion._tag, false);
    missedTeddyTypes.push(currentQuestion._tag);
    setTimeout(() => speakText("Nearly! It's " + spokenAnswer, 0.85), 200);
    const adaptive = checkAdaptive(p, 3);
    if (adaptive === 'down') { p.level--; p.recentAnswers = []; saveTeddyProfile(p); setTimeout(() => nextTeddyQuestion(), 2500); return; }
    saveTeddyProfile(p);
    setTimeout(() => nextTeddyQuestion(), 2500);
  }
}

// =====================================================================
// PARENT VIEW
// =====================================================================
const STATUS_LABEL = { mastered:'Mastered', solid:'Solid', learning:'Learning', shaky:'Shaky', new:'Not started', locked:'🔒 Locked' };

function activityDots(p) {
  let html = '<div class="dots"><span class="lbl">Last 14 days</span>';
  const goal = GOALS[p.name] || 30;
  for (let i = 13; i >= 0; i--) {
    const d = todayStr(-i * DAY);
    const pts = p.daily.hist[d] || 0;
    const cls = pts >= goal ? 'hit' : (pts > 0 ? 'part' : '');
    html += '<span class="dot ' + cls + '" title="' + d + ': ' + pts + '"></span>';
  }
  return html + '</div>';
}

function renderKid(name) {
  const p = loadChild(name);
  const display = name.charAt(0).toUpperCase() + name.slice(1);
  const goal = GOALS[name] || 30;
  let html = '<div class="kid-card"><h3>' + AVATARS[name] + ' ' + display + ' <span class="chip">' + CLASS_INFO[name] + '</span></h3>';
  html += '<div class="chips">';
  html += '<span class="chip">🔥 ' + (p.daily.streak||0) + '-day streak</span>';
  html += '<span class="chip">⭐ ' + p.daily.pts + '/' + goal + ' today</span>';
  html += '<span class="chip">🎖️ ' + (p.score||0) + ' lifetime</span>';
  if (name !== 'teddy') {
    const mastered = TOPICS.filter(t => (p.topics[t.id]||{s:0}).s >= 5).length;
    html += '<span class="chip">🏆 ' + mastered + '/' + TOPICS.length + ' topics</span>';
    const wordsSolid = Object.keys(p.spelling.words).filter(w => p.spelling.words[w].s >= 3).length;
    html += '<span class="chip">📚 Band ' + p.spelling.band + ' · ' + wordsSolid + ' words solid</span>';
  }
  html += '</div>';
  html += activityDots(p);

  if (name === 'teddy') {
    const tp = getTeddyProfile();
    html += '<div class="bandhd">Teddy’s game</div><div class="prow"><span class="pname">🧸 Level ' + (tp.level||1) + ' of 3</span><span class="pill st-solid">' + (tp.score||0) + ' stars ever</span><span class="ppct"></span></div>';
    html += '</div>';
    return html;
  }

  for (let band = 1; band <= 5; band++) {
    const rows = TOPICS.filter(t => t.band === band);
    html += '<div class="bandhd">Maths · Band ' + band + '</div>';
    rows.forEach(t => {
      const st = p.topics[t.id];
      const status = topicStatus(p, t);
      const n = st ? st.r + st.w : 0;
      const pct = n ? Math.round(st.r / n * 100) + '%' : '–';
      const slow = t.fam === 'facts' && st && st.ema && st.ema > FLUENT.facts && st.reps >= 3 ? ' 🐢' : '';
      html += '<div class="prow"><span class="pname">' + t.emoji + ' ' + t.name + slow + '</span>' +
        '<span class="pill st-' + status + '">' + STATUS_LABEL[status] + '</span>' +
        '<span class="ppct">' + pct + '</span></div>';
    });
  }

  const trouble = Object.keys(p.spelling.words).filter(w => { const ws = p.spelling.words[w]; return ws.w > 0 && ws.s < 2; });
  if (trouble.length) html += '<div class="trouble">📝 Tricky words right now: <b>' + trouble.slice(0, 10).join(', ') + '</b></div>';
  html += '</div>';
  return html;
}

function showParent() {
  document.getElementById('parent-content').innerHTML = renderKid('elsie') + renderKid('freya') + renderKid('teddy');
  showScreen('screen-parent');
}

// =====================================================================
// EFFECTS
// =====================================================================
function showDone(p) {
  document.getElementById('done-msg').textContent = 'Daily goal smashed! 🎉';
  document.getElementById('done-sub').textContent = '🔥 ' + p.daily.streak + ' day' + (p.daily.streak === 1 ? '' : 's') + ' in a row — brilliant!';
  document.getElementById('done-overlay').classList.add('show');
  spawnConfetti(); spawnConfetti();
}

function hideDone(finish) {
  document.getElementById('done-overlay').classList.remove('show');
  if (finish) goHome();
  else if (document.getElementById('screen-game').classList.contains('active')) {
    document.getElementById('game-input').focus();
  }
}

let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

function spawnConfetti() {
  const colors = ['#4285f4', '#34a853', '#f9ab00', '#ea4335', '#9334e6', '#1a73e8'];
  for (let i = 0; i < 20; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + 'vw';
    piece.style.top = '-10px';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = Math.random() * 0.5 + 's';
    piece.style.animationDuration = (1 + Math.random()) + 's';
    piece.style.width = (6 + Math.random() * 8) + 'px';
    piece.style.height = (6 + Math.random() * 8) + 'px';
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 2000);
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    if (document.getElementById('screen-game').classList.contains('active')) {
      if (document.getElementById('done-overlay').classList.contains('show')) return;
      if (waiting) nextQuestion();
      else checkAnswer();
    }
  }
});

if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => {
    const isKeyboard = window.visualViewport.height < window.innerHeight * 0.75;
    document.body.classList.toggle('keyboard-open', isKeyboard);
  });
}

window.speechSynthesis.onvoiceschanged = () => {};
window.speechSynthesis.getVoices();

init();
